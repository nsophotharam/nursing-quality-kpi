<!DOCTYPE html>
<html lang="th">
<head>

    <!-- Fonts: Prompt & Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'Kanit', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            pink: '#FCE7F3', pinkDark: '#BE185D',
                            blue: '#E0F2FE', blueDark: '#0369A1',
                            green: '#D1FAE5', greenDark: '#047857',
                            cream: '#FFFBEB', purple: '#F3E8FF',
                            orange: '#FFEDD5', orangeDark: '#C2410C'
                        }
                    },
                    animation: {
                        'slide-in-right': 'slideInRight 0.3s ease-out forwards',
                        'fade-out': 'fadeOut 0.5s ease-in forwards',
                    },
                    keyframes: {
                        slideInRight: {
                            '0%': { transform: 'translateX(100%)', opacity: '0' },
                            '100%': { transform: 'translateX(0)', opacity: '1' },
                        },
                        fadeOut: {
                            '0%': { opacity: '1' },
                            '100%': { opacity: '0', display: 'none' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Excel Export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        body { background-color: #Fdfbf7; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: 0 2px 15px rgba(244, 114, 182, 0.15); }
        .input-pastel { background-color: #F9FAFB; border: 1px solid #E5E7EB; transition: all 0.3s ease; }
        .input-pastel:focus { background-color: #FFF; border-color: #F472B6; box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.2); outline: none; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #FBCFE8; border-radius: 10px; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Sticky Table Header Styles */
        .table-container { max-height: 600px; overflow-y: auto; }
        .table-container thead th { position: sticky; top: 0; z-index: 20; background-color: rgba(252, 231, 243, 0.95); backdrop-filter: blur(4px); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;
        
        // --- CONFIGURATION ---
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzxL-bpaskhEyWxhJIcJFOCS_kUL-AQsPwJYEjhgtNIY4AXX9ClAKHw-aOp2tqELzd8g/exec";
        const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1M7dZ8kXGuokvgt5b_hOEJ4A1Wwk44Ab4yANVpYHNrbU/edit";
        const HOSPITAL_LOGO = "https://img2.pic.in.th/pic/NSO-1362defbb9c0521d4.png";
        const KPI_DICT_URL = "https://docs.google.com/document/d/1bYNfkAwQvzba-g4wc5hxFsoT9h3UMx11/edit"; 

        const UNITS = ["ANC", "Anest", "CAPD", "ER", "IC", "ICU", "LR", "NICU", "OPD", "OPD จักษุ", "OR", "Ortho", "เด็ก", "ไตเทียม", "พ.1", "พ.2", "พ.3", "พ.4", "ศัลย์", "Palliative care", "สนว", "สงฆ์", "อช", "อญ"];
        const ALL_UNITS_EXCEPT_IC = UNITS.filter(u => u !== 'IC');

        // --- ICONS ---
        const Icons = {
            Activity: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>),
            Database: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>),
            AlertCircle: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>),
            Table: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="12" y1="3" x2="12" y2="21"/></svg>),
            Save: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>),
            Edit: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>),
            ExternalLink: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>),
            RefreshCw: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>),
            Download: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>),
            Settings: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>),
            Wifi: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>),
            WifiOff: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>),
            TrendingUp: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>),
            Calculator: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>),
            Trash: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>),
            Info: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>),
            CheckCircle: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>),
            ClipboardList: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 14h.01"/><path d="M9 10h.01"/><path d="M9 18h.01"/><path d="M13 14h4"/><path d="M13 10h4"/><path d="M13 18h4"/></svg>),
            Target: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>),
            AlertTriangle: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>),
            Lightbulb: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>),
            Search: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>),
            Filter: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>),
            X: ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>)
        };

        // --- KPI DEFINITIONS & TARGET MAPPING ---
        const INITIAL_HOSPITAL_KPIS = [
            { id: 1, name: "Pressure Ulcer rate", category: 'general', target: 4, comparator: "<=", unit: "per 1,000 pt-days", type: 'hospital', calcType: 'rate_1000', labelA: "จำนวนเกิดแผลกดทับ", labelB: "วันนอนผู้ป่วยรวม", denominatorRef: 901, targetUnits: ALL_UNITS_EXCEPT_IC },
            { id: 2, name: "Fall with injury", category: 'general', target: 1, comparator: "<", unit: "per 1,000 pt-days", type: 'hospital', calcType: 'rate_1000', labelA: "จำนวนพลัดตกหกล้ม", labelB: "วันนอนผู้ป่วยรวม", denominatorRef: 901, targetUnits: ALL_UNITS_EXCEPT_IC },
            { id: 3, name: "Readmission 28 days", category: 'general', target: 5, comparator: "<=", unit: "%", type: 'hospital', calcType: 'rate_100', labelA: "จำนวน Readmit", labelB: "จำนวนจำหน่ายเดือนก่อน", targetUnits: ALL_UNITS_EXCEPT_IC },
            { id: 4, name: "Phlebitis >= grade 3", category: 'general', target: 0, comparator: "=", unit: "cases", type: 'hospital', calcType: 'count', targetUnits: ALL_UNITS_EXCEPT_IC },
            { id: 5, name: "Blood transfusion error", category: 'general', target: 0, comparator: "=", unit: "cases", type: 'hospital', calcType: 'count', targetUnits: ALL_UNITS_EXCEPT_IC },
            { id: 15, name: "Accidental extubation", category: 'general', target: 10, comparator: "<", unit: "per 1,000 ventilator-days", type: 'hospital', calcType: 'rate_1000', labelA: "จำนวนท่อเลื่อนหลุด", labelB: "วันใส่เครื่องช่วยหายใจ", denominatorRef: 902, targetUnits: ALL_UNITS_EXCEPT_IC },
            { id: 7, name: "Nurse injury/infection", category: 'general', target: 0, comparator: "=", unit: "cases", type: 'hospital', calcType: 'count', targetUnits: ALL_UNITS_EXCEPT_IC },
            { id: 902, name: "Ventilator Days", category: 'general', target: 0, comparator: ">", unit: "days", type: 'hospital', calcType: 'count', isICData: true, manualInput: true, targetUnits: ALL_UNITS_EXCEPT_IC },
            { id: 903, name: "Catheter Days", category: 'general', target: 0, comparator: ">", unit: "days", type: 'hospital', calcType: 'count', isICData: true, manualInput: true, targetUnits: ALL_UNITS_EXCEPT_IC },
            { id: 904, name: "Central Line Days", category: 'general', target: 0, comparator: ">", unit: "days", type: 'hospital', calcType: 'count', isICData: true, manualInput: true, targetUnits: ALL_UNITS_EXCEPT_IC },
            
            // IC Specific KPIs (Only for 'IC' unit)
            { id: 8, name: "VAP", category: 'ic', target: 1, comparator: "<", unit: "per 1,000 ventilator-days", type: 'hospital', calcType: 'rate_1000', labelA: "จำนวน VAP", labelB: "วันใส่เครื่องช่วยหายใจ", denominatorRef: 902, targetUnits: ['IC'] },
            { id: 9, name: "CAUTI", category: 'ic', target: 1.5, comparator: "<", unit: "per 1,000 catheter-days", type: 'hospital', calcType: 'rate_1000', labelA: "จำนวน CAUTI", labelB: "วันใส่สายสวนปัสสาวะ", denominatorRef: 903, targetUnits: ['IC'] },
            { id: 11, name: "NI rate", category: 'ic', target: 3, comparator: "<=", unit: "per 1,000 pt-days", type: 'hospital', calcType: 'rate_1000', labelA: "จำนวน NI", labelB: "วันนอนผู้ป่วยรวม", denominatorRef: 901, targetUnits: ['IC'] },
            { id: 10, name: "CLABSI", category: 'ic', target: 1.5, comparator: "<", unit: "per 1,000 central line-days", type: 'hospital', calcType: 'rate_1000', labelA: "จำนวน CLABSI", labelB: "วันใส่ Central Line", denominatorRef: 904, targetUnits: ['IC'] },
        ];

        // --- ตัวชี้วัดกลางของหน่วยงาน (Shared Unit KPIs) ---
        const INITIAL_UNIT_KPIS = [
            { id: 9001, name: "อัตราความพึงพอใจผู้ใช้บริการ", category: 'general', target: 80, comparator: ">=", unit: "%", type: 'unit', calcType: 'rate_100', labelA: "คะแนนรวมที่ได้", labelB: "คะแนนเต็มรวม", ownerUnit: 'ALL' }
        ];

        // --- HELPER FUNCTIONS ---
        const checkPass = (actual, target, comparator) => {
            const act = parseFloat(actual);
            const tgt = parseFloat(target);
            switch (comparator) {
                case "<": return act < tgt;
                case "<=": return act <= tgt;
                case "=": return act === tgt;
                case ">=": return act >= tgt;
                case ">": return act > tgt;
                default: return false;
            }
        };

        const getMonthName = (m) => ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"][m];
        const getShortMonthName = (m) => ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."][m];
        const getCurrentYear = () => new Date().getFullYear() + 543;
        const generateUUID = () => (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).substring(2);
        
        // ฟังก์ชันแปลง ปีปฏิทิน -> ปีงบประมาณ (ต.ค. = เดือน 9 -> เป็นปีงบถัดไป)
        const getFiscalYear = (monthIndex, year) => (monthIndex >= 9) ? parseInt(year) + 1 : parseInt(year);

        // --- COMPONENTS ---
        const ChartComponent = ({ type, data, options }) => {
            const canvasRef = useRef(null);
            const chartInstanceRef = useRef(null);
            useEffect(() => {
                if (canvasRef.current) {
                    if (chartInstanceRef.current) chartInstanceRef.current.destroy();
                    chartInstanceRef.current = new Chart(canvasRef.current.getContext('2d'), { type, data, options });
                }
                return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
            }, [type, data, options]);
            return <canvas ref={canvasRef} />;
